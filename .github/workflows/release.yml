name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archives
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          echo "VER=$V" >> "$GITHUB_ENV"
          git archive --format=tar.gz --prefix="tingji-$V/" -o "tingji-$V.tar.gz" HEAD
          git archive --format=zip    --prefix="tingji-$V/" -o "tingji-$V.zip" HEAD
          sha256sum "tingji-$V.tar.gz" "tingji-$V.zip" > SHA256SUMS
          ls -lh tingji-* SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "tingji-${{ env.VER }}"
          generate_release_notes: true
          files: |
            tingji-${{ env.VER }}.tar.gz
            tingji-${{ env.VER }}.zip
            SHA256SUMS
